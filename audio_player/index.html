<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin:0; padding:0; font-family:system-ui,sans-serif; color:#475569; background:transparent; }
    .wrap { border:1px solid #e5e7eb; border-radius:14px; padding:12px 14px; background:#fff; }
    .row { display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px; font-weight:650; }
    .dot { width:9px; height:9px; border-radius:50%; background:#f59e0b; }
    .dot.done { background:#16a34a; }
    audio { width:100%; height:38px; }
    .note { font-size:11px; color:#64748b; margin-top:5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row"><span id="dot" class="dot"></span><span id="status">Playing interviewer question…</span></div>
    <audio id="player" controls preload="auto"></audio>
    <div class="note">Wait until playback finishes to unlock your answer controls.</div>
  </div>
<script>
(function() {
  const audio = document.getElementById("player");
  const status = document.getElementById("status");
  const dot = document.getElementById("dot");
  let lastQuestionKey = null;
  let sent = false;

  function sendReady(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: "streamlit:setComponentValue",
      value: value
    }, "*");
  }

  function render() {
    const args = window.__streamlit && window.__streamlit.args;
    if (!args || !args.audio_b64) return;
    if (args.question_key !== lastQuestionKey) {
      lastQuestionKey = args.question_key;
      sent = false;
      audio.src = "data:audio/wav;base64," + args.audio_b64;
      status.textContent = "Playing interviewer question…";
      dot.classList.remove("done");
      sendReady(false);
      if (args.autoplay) {
        const promise = audio.play();
        if (promise && promise.catch) {
          promise.catch(() => {
            status.textContent = "Press play to hear the question";
          });
        }
      }
    }
  }

  audio.addEventListener("ended", function() {
    if (sent) return;
    sent = true;
    status.textContent = "Playback complete — you can answer";
    dot.classList.add("done");
    sendReady(true);
  });

  audio.addEventListener("play", function() {
    if (!sent) {
      status.textContent = "Playing interviewer question…";
      dot.classList.remove("done");
    }
  });

  window.addEventListener("message", function(event) {
    const data = event.data;
    if (data && data.type === "streamlit:render") {
      window.__streamlit = window.__streamlit || {};
      window.__streamlit.args = data.args;
      render();
    }
  });

  window.parent.postMessage({isStreamlitMessage:true, type:"streamlit:componentReady", apiVersion:1}, "*");
  window.parent.postMessage({isStreamlitMessage:true, type:"streamlit:setFrameHeight", height:140}, "*");
})();
</script>
</body>
</html>
